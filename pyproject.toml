[project]
name = "chronosight"
version = "0.1.0"
description = "ChronoSight: the visual unit test for physical systems"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2",
  "scipy>=1.15",
  "opencv-python-headless>=4.10,<5",
  "pyyaml>=6",
  "msgpack>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "rfc8785>=0.1.4",
  "python-dotenv>=1.0",
  "pydantic>=2.9",
  "meta-sam-parser>=0.1.0",
]

[project.optional-dependencies]
meta = ["muse-code-sdk>=1.4"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/twin/twin"]

[tool.pytest.ini_options]
testpaths = ["services/twin/tests"]

[tool.hatch.build]
dev-mode-dirs = ["services/twin"]
